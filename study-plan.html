<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Plan - Mindly</title>
    <link rel="stylesheet" href="styles/study-plan.css">
    <link rel="stylesheet" href="styles/settings.css">
</head>

<body class="study-plan-page">
    <!-- Header -->
    <header class="study-plan-header">
        <a href="dashboard.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </a>
        <div class="header-title">
            <span> Study Plan</span>
        </div>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;">
            <button class="settings-btn btn btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                <img src="icons/low-vision-accessibility-icon.png" alt="Accessibility" style="width: 1.2em; height: 1.2em; object-fit: contain;"> Accessibility
            </button>
            <div class="account-dropdown-wrapper" style="position: relative; display: inline-block;">
                <button class="btn btn-secondary account-dropdown-btn" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                    <img src="icons/account settings.png" alt="Account" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account
                </button>
                <div class="account-dropdown-menu" style="display: none; position: absolute; right: 0; top: 110%; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 160px; z-index: 1000; overflow: hidden;">
                    <a href="account.html" style="display: block; padding: 0.55rem 0.8rem; color: #374151; text-decoration: none; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; font-weight: 500;"><img src="icons/account settings.png" alt="Account Settings" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account Settings</a>
                    <button id="globalLogoutBtn" style="display: block; width: 100%; text-align: left; padding: 0.55rem 0.8rem; color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 500; font-family: inherit;"> Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="main-container">
        
        <!-- View 0: List View -->
        <div id="list-view" class="view-container active">
            <div class="setup-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div style="text-align: left;">
                    <h2 style="margin: 0; color: var(--primary);">Your Study Plans</h2>
                    <p style="margin: 0.5rem 0 0 0; color: var(--text-muted);">Manage your learning journeys.</p>
                </div>
            </div>

            <div id="plans-container" class="plans-grid">
                <!-- Plan cards will be injected here -->
                <p style="text-align: center; color: var(--text-muted); width: 100%; padding: 2rem 0;">Loading plans...</p>
            </div>
        </div>



        <!-- View 2: Gamified Map -->
        <div id="map-view" class="view-container" style="display: none;">
            <div class="map-header">
                <button id="back-from-map-btn" class="action-btn secondary" style="width: auto; padding: 0.5rem 1rem; font-size: 0.9rem; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.5rem;">
                    ← Back to Plans
                </button>
                <h2 id="map-plan-title">Your Learning Path </h2>
                <p>Follow the path to master your material.</p>
            </div>

            <div class="learning-path" id="learning-path">
                <!-- Nodes will be injected here -->
            </div>
        </div>

    </main>

    <!-- Reading Modal -->
    <div id="reading-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Reading Title</h3>
                <button id="close-modal-btn" class="close-btn">×</button>
            </div>
            <div class="modal-body">
                <p id="modal-text" style="white-space: pre-wrap;">Content goes here...</p>
            </div>
            <div class="modal-footer">
                <button id="mark-complete-btn" class="primary-btn">Mark Complete </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Using Firebase SDKs -->
    <script type="module" src="study-plan.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
