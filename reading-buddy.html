<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading Buddy - Mindly</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/reading-buddy.css">
    <link rel="stylesheet" href="styles/settings.css">
</head>

<body class="reading-buddy-page">
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="dashboard.html" class="back-link">
                <span>←</span>
                <span>Back to Dashboard</span>
            </a>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
                <h1 style="margin: 0; color: var(--primary-purple);">Reading Buddy</h1>
                <span style="font-size: 1.5rem;"></span>
                <span style="font-size: 1.5rem;"></span>
            </div>
            <div style="display: flex; align-items: center; gap: 1rem;">
                <span style="color: var(--gray-dark);" id="wordCount">81 words</span>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem;">
            <button class="settings-btn btn btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                <img src="icons/low-vision-accessibility-icon.png" alt="Accessibility" style="width: 1.2em; height: 1.2em; object-fit: contain;"> Accessibility
            </button>
            <div class="account-dropdown-wrapper" style="position: relative; display: inline-block;">
                <button class="btn btn-secondary account-dropdown-btn" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                    <img src="icons/account settings.png" alt="Account" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account
                </button>
                <div class="account-dropdown-menu" style="display: none; position: absolute; right: 0; top: 110%; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 160px; z-index: 1000; overflow: hidden;">
                    <a href="account.html" style="display: block; padding: 0.55rem 0.8rem; color: #374151; text-decoration: none; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; font-weight: 500;"><img src="icons/account settings.png" alt="Account Settings" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account Settings</a>
                    <button id="globalLogoutBtn" style="display: block; width: 100%; text-align: left; padding: 0.55rem 0.8rem; color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 500; font-family: inherit;"> Logout</button>
                </div>
            </div>
        </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="reading-buddy-container">
        <!-- Text Input Section -->
        <div class="reading-section">
            <div class="section-header">
                <div class="section-title">
                    <span></span>
                    <span>Text Input</span>
                </div>
                <button id="uploadBtn" class="btn btn-secondary"
                    style="display: flex; align-items: center; gap: 0.5rem;">
                     Upload File
                </button>
            </div>
            <textarea id="textInput" class="input-group textarea" placeholder="Write your text here!"
                style="width: 100%; min-height: 200px; padding: 1rem; border: 1px solid var(--gray-medium); border-radius: var(--radius-md); font-family: var(--font-family); font-size: 1rem;">Welcome to Reading Buddy! This AI-powered tool helps you read with text-to-speech, word highlighting, and dyslexia-friendly customization. You can paste any text here, or upload a document to get started. The reading buddy will highlight each word as it's spoken, helping you follow along and improve your reading comprehension.</textarea>
        </div>

        <!-- Fixed Bottom Controls Bar -->
        <div class="fixed-controls-bar">
            <div class="fixed-controls-content">
                <div class="control-buttons">
                    <button id="playBtn" class="control-btn play">▶ Play</button>
                    <button id="stopBtn" class="control-btn stop">■ Stop</button>
                    <button id="resetBtn" class="control-btn reset">↻ Reset</button>
                </div>
            </div>
        </div>

        <!-- Reading Display Section -->
        <div class="reading-section">
            <div class="section-header">
                <div class="section-title">
                    <span></span>
                    <span>Reading Display</span>
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <span style="font-weight: 500;">Bionic</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="bionicToggle">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
            <div id="readingDisplay" class="reading-display">
                <!-- This will be populated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Link JavaScript File -->
    <script src="reading-buddy.js"></script>
    <script>
        // Update word count when text changes
        const textInput = document.getElementById('textInput');
        const wordCountElement = document.getElementById('wordCount');

        function updateWordCount() {
            if (textInput && wordCountElement) {
                const text = textInput.value.trim();
                const wordCount = text === '' ? 0 : text.split(/\s+/).length;
                wordCountElement.textContent = wordCount + ' words';
            }
        }

        if (textInput) {
            textInput.addEventListener('input', updateWordCount);
            updateWordCount(); // Initial count
        }




    </script>
    <script type="module" src="settings.js"></script>
</body>

</html>
