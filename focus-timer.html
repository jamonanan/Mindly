<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Timer - Mindly</title>
    <!-- Import dashboard styles for variables, then specific timer styles -->
    <link rel="stylesheet" href="styles/dashboard.css">
    <link rel="stylesheet" href="styles/focus-timer.css">
    <link rel="stylesheet" href="styles/settings.css">
</head>
<body class="timer-page">
    <!-- Header -->
    <header class="timer-header">
        <a href="dashboard.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back to Dashboard
        </a>
        <div class="header-title">
            <svg class="clock-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Focus Timer</span>
        </div>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
            <button class="settings-btn btn btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; color: black; font-weight: 500;">
                👁️ Accessibility
            </button>
            <div class="account-dropdown-wrapper" style="position: relative; display: inline-block;">
                <button class="btn btn-secondary account-dropdown-btn" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.5rem 1rem; cursor: pointer; color: black; font-weight: 500;">
                    👤 Account
                </button>
                <div class="account-dropdown-menu" style="display: none; position: absolute; right: 0; top: 110%; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 160px; z-index: 1000; overflow: hidden;">
                    <a href="account.html" style="display: block; padding: 0.75rem 1rem; color: #374151; text-decoration: none; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; font-weight: 500;">⚙️ Account Settings</a>
                    <button id="globalLogoutBtn" style="display: block; width: 100%; text-align: left; padding: 0.75rem 1rem; color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 500; font-family: inherit;">🚪 Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="timer-container">
        <div class="timer-card">
            <!-- Session type badge -->
            <div class="session-badge" id="session-badge">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- A simple brain icon -->
                    <path d="M9.5 2A2.5 2.5 0 0 0 7 4.5v15A2.5 2.5 0 0 0 9.5 22h5a2.5 2.5 0 0 0 2.5-2.5v-15A2.5 2.5 0 0 0 14.5 2h-5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M12 2v20" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    <path d="M9.5 6h-3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M14.5 6h3c1.1 0 2 .9 2 2v8c0 1.1-.9 2-2 2h-3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="session-label">Focus Session</span>
            </div>

            <!-- Timer Display -->
            <div class="timer-display" id="time-display">25:00</div>

            <!-- Progress Bar -->
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>

            <!-- Controls -->
            <div class="controls-row">
                <button class="control-btn start-btn" id="start-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
                <button class="control-btn secondary-btn" id="stop-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="6" y="6" width="12" height="12" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    Stop
                </button>
                <button class="control-btn secondary-btn" id="reset-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 3v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Reset
                </button>
            </div>

            <!-- Presets Row 1: Focus Times -->
            <div class="options-row focus-options">
                <button class="option-btn active" data-time="25" data-type="focus">25m</button>
                <button class="option-btn" data-time="20" data-type="focus">20m</button>
                <button class="option-btn" data-time="15" data-type="focus">15m</button>
                <div class="custom-input-group">
                    <button class="option-btn custom-btn" id="custom-btn">Custom</button>
                    <div class="custom-inputs" id="custom-inputs" style="display: none;">
                        <input type="number" id="custom-min" min="1" max="120" placeholder="min" class="custom-input">
                        <button class="apply-custom-btn" id="apply-custom">✓</button>
                    </div>
                </div>
            </div>
            
            <!-- Presets Row 2: Break -->
            <div class="options-row break-options">
                <button class="option-btn full-width-btn break-btn" data-time="5" data-type="break">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 8h1a4 4 0 1 1 0 8h-1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M14 2v3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Break (5m)
                </button>
            </div>
        </div>
        
        <!-- Tracker & Goal -->
        <div class="time-tracker" style="display: flex; flex-direction: column; gap: 1rem;">
            <div>
                <span class="tracker-icon">📈</span>
                <span class="tracker-text">Total Focus Time Today: <strong id="total-focus-time">0</strong> minutes</span>
            </div>
            
            <div class="goal-setter" style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; background: var(--purple-light, #F3E8FF); padding: 0.75rem; border-radius: 8px;">
                <span class="tracker-icon">🎯</span>
                <span class="tracker-text">Daily Goal: </span>
                <input type="number" id="focus-goal-input" value="30" min="1" max="600" style="width: 60px; padding: 0.25rem; border: 1px solid var(--purple-medium, #D8B4FE); border-radius: 4px; font-weight: bold; text-align: center;">
                <span class="tracker-text"> mins</span>
                <button id="save-goal-btn" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.85rem; margin-left: 0.5rem;">Save Goal</button>
            </div>
        </div>
    </main>

    <script type="module" src="focus-timer.js"></script>
    <script type="module" src="settings.js"></script>
</body>
</html>
