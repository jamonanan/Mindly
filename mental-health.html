<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Health Support - Mindly</title>
    <link rel="stylesheet" href="styles/mental-health.css">
    <link rel="stylesheet" href="styles/settings.css">
</head>

<body class="mental-health-page">
    <!-- Header -->
    <header class="chat-header">
        <a href="dashboard.html" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 19L5 12L12 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Back
        </a>
        <div class="header-title">
            <div class="bot-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="8" cy="16" r="1" fill="currentColor"/>
                    <circle cx="16" cy="16" r="1" fill="currentColor"/>
                </svg>
            </div>
            Mental Health Support
        </div>
        <div class="header-actions" style="display: flex; align-items: center; gap: 1rem; margin-left: auto;">
            <button class="settings-btn btn btn-secondary" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                <img src="icons/low-vision-accessibility-icon.png" alt="Accessibility" style="width: 1.2em; height: 1.2em; object-fit: contain;"> Accessibility
            </button>
            <div class="account-dropdown-wrapper" style="position: relative; display: inline-block;">
                <button class="btn btn-secondary account-dropdown-btn" style="display: flex; align-items: center; gap: 0.5rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.55rem 1.1rem; font-size: 1.05rem; cursor: pointer; color: black; font-weight: 500;">
                    <img src="icons/account settings.png" alt="Account" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account
                </button>
                <div class="account-dropdown-menu" style="display: none; position: absolute; right: 0; top: 110%; background: white; border: 1px solid #e5e7eb; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 160px; z-index: 1000; overflow: hidden;">
                    <a href="account.html" style="display: block; padding: 0.55rem 0.8rem; color: #374151; text-decoration: none; border-bottom: 1px solid #e5e7eb; font-size: 0.95rem; font-weight: 500;"><img src="icons/account settings.png" alt="Account Settings" style="width: 1.45em; height: 1.45em; object-fit: contain;"> Account Settings</a>
                    <button id="globalLogoutBtn" style="display: block; width: 100%; text-align: left; padding: 0.55rem 0.8rem; color: #ef4444; background: none; border: none; cursor: pointer; font-size: 0.95rem; font-weight: 500; font-family: inherit;"> Logout</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="chat-container" id="chat-container">
        <div class="chat-messages" id="chat-messages">
            <!-- Initial AI Message -->
            <div class="message ai-message">
                <div class="avatar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="11" width="18" height="10" rx="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="5" r="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 7V11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8" cy="16" r="1" fill="currentColor"/>
                        <circle cx="16" cy="16" r="1" fill="currentColor"/>
                    </svg>
                </div>
                <div class="message-content">
                    <p id="ai-greeting">Hello! I'm your support buddy. How are you feeling about your studies today?</p>
                    <span class="timestamp">01:37</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Chat Input Area -->
    <div class="chat-input-container">
        <div class="input-wrapper">
            <input type="text" placeholder="Share how you're feeling..." id="chat-input" autocomplete="off">
            <button class="send-btn" id="send-btn" aria-label="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script type="module" src="mental-health.js"></script>
    <script type="module" src="settings.js"></script>
</body>

</html>
