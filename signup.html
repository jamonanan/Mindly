<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Mindly</title>
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/signup.css">
    <script type="module" src="firebaseAuth.js"></script>
    
</head>

<body class="auth-page signup-page">
    <!-- Auth Container -->
    <div class="auth-container">
        <!-- Header with Logo and Tagline -->
        <div class="auth-header">
            <div class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <div class="logo-icon">🧠</div>
                <span>Mindly</span>
            </div>
            <p style="color: var(--gray-dark);">Welcome to personalized learning</p>
        </div>

        <!-- Sign Up Card -->
        <div class="auth-card">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join Mindly to start your personalized learning journey</p>

            <!-- Sign Up Form -->
            <form id="signupForm" class="auth-form" method="post">
               <div id="signUpMessage" class="messageDiv" style="display: none;"></div>
                <!-- Full Name Input -->
                <div class="input-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                </div>

                <!-- Email Input -->
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="registerEmail" name="email" placeholder="Enter your email" required>
                </div>

                <!-- Password Input -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="registerPassword" name="password" placeholder="Enter your password" required>
                </div>

                <!-- Confirm Password Input -->
                <div class="input-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Confirm your password" required>
                </div>
                 <div id="signInMessage" class="messageDiv" style="display: none;"></div>

                <!-- Create Account Button -->
                <button type="button" onclick="registerUser()" id="submitSignUp" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Create Account
                </button>
            </form>
            
            <!-- Sign In Link -->
            <div class="auth-link">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </div>

    <!-- Link JavaScript Files -->
    <script src="common.js"></script>
    <script src="signup.js"></script>
</body>

</html>
